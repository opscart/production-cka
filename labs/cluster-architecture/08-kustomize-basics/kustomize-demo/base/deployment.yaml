apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-api
  labels:
    app: pharma-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharma-api
  template:
    metadata:
      labels:
        app: pharma-api
    spec:
      containers:
      - name: pharma-api
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
