apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-rolebinding
  namespace: dev
subjects:
# Who gets the permissions
- kind: ServiceAccount
  name: dev-user
  namespace: dev
roleRef:
  # What permissions they get
  kind: Role
  name: dev-role
  apiGroup: rbac.authorization.k8s.io
 